# ============================================================
#  Configuración del servidor
# ============================================================
server.port=8081


#  Configuración de Base de Datos MySQL

spring.datasource.url=jdbc:mysql://localhost:3307/finanzas_estudiantiles?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# update  actualiza tablas si ya existen (usa esto en desarrollo)
# create   crea tablas desde cero (cuidado: borra datos)
# validate  solo valida sin modificar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
#  Nombre de la aplicación
# ============================================================
spring.application.name=finanzas-estudiantiles

# ============================================================
#  Mercado Libre OAuth (llenar con tus valores)
# ============================================================
ml.oauth.client-id=YOUR_CLIENT_ID_HERE
ml.oauth.client-secret=YOUR_CLIENT_SECRET_HERE
ml.oauth.redirect-uri=https://kitten-blasphemy-blurt.ngrok-free.dev/api/ml/callback
ml.oauth.auth-base=https://auth.mercadolibre.com.co
ml.oauth.token-url=https://api.mercadolibre.com/oauth/token
