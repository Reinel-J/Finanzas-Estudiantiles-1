# ============================================================
#  Configuración del servidor
# ============================================================
server.port=8081


#  Configuración de Base de Datos MySQL
#  Las credenciales se leen de variables de entorno; el valor tras ":" es el
#  valor por defecto para desarrollo local. NO escribas aquí credenciales reales:
#  usa variables de entorno o un archivo .env (ignorado por git).

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/finanzas_estudiantiles?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# update  actualiza tablas si ya existen (usa esto en desarrollo)
# create   crea tablas desde cero (cuidado: borra datos)
# validate  solo valida sin modificar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mantiene la sesión de Hibernate abierta durante la serialización JSON (explícito para silenciar el aviso)
spring.jpa.open-in-view=true

# ============================================================
#  Nombre de la aplicación
# ============================================================
spring.application.name=finanzas-estudiantiles

# ============================================================
#  Mercado Libre OAuth
#  Define ML_OAUTH_CLIENT_ID, ML_OAUTH_CLIENT_SECRET y ML_OAUTH_REDIRECT_URI
#  como variables de entorno. Nunca pongas el client-secret en este archivo.
# ============================================================
ml.oauth.client-id=${ML_OAUTH_CLIENT_ID:}
ml.oauth.client-secret=${ML_OAUTH_CLIENT_SECRET:}
ml.oauth.redirect-uri=${ML_OAUTH_REDIRECT_URI:}
ml.oauth.auth-base=https://auth.mercadolibre.com.co
ml.oauth.token-url=https://api.mercadolibre.com/oauth/token

# ============================================================
#  Conversión de moneda (ExchangeRate-API)
#  Opcional: sin key se usa el endpoint abierto open.er-api.com
#  También se puede definir con la variable de entorno MONEDA_API_KEY
# ============================================================
moneda.api-key=${MONEDA_API_KEY:}
