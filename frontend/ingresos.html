  <div class="contenido">

    <p class="page-title">Ingresos</p>
    <p class="page-subtitle">Registra y gestiona tus fuentes de ingreso</p>

    <p class="seccion-titulo">Agregar ingreso</p>

    <!-- Formulario para agregar un nuevo ingreso -->
    <div class="form-agregar">
      <div class="form-grupo">
        <label>Descripción</label>
        <input id="descripcion" type="text" placeholder="Ej: Salario, Freelance...">
        <!-- El backend espera este campo como "descripcion" -->
      </div>
      <div class="form-grupo">
        <label>Categoría</label>
        <select id="categoria"> <!-- Lista de categorías predefinidas -->
          <option value="Salario">Salario</option>
          <option value="Freelance">Freelance</option>
          <option value="Negocio">Negocio</option>
          <option value="Inversión">Inversión</option>
          <option value="Regalo">Regalo</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-grupo">
        <label>Valor (COP $)</label>
        <input id="monto" type="text" inputmode="numeric" placeholder="Ej: 500.000" data-cop="true">
        <!-- min="0" evita que se ingresen valores negativos -->
      </div>
      <div class="form-grupo">
        <label>Fecha</label>
        <input id="fecha" type="date"> <!-- El valor llega en formato YYYY-MM-DD -->
      </div>
      <button class="btn-agregar" onclick="agregarIngresoNuevo()">+ Agregar</button>
    </div>

    <p class="seccion-titulo">Historial de ingresos</p>
    <div class="lista-movimientos" id="listaIngresos"></div> <!-- Se llena dinámicamente -->

  </div>

  <script src="js/api.js"></script>
  <script src="js/cop-input.js"></script>

  <script>

    verificarSesion(); // Redirige al login si no hay sesión activa

    function formatCOP(n) { // Convierte número a formato pesos colombianos
      return "$" + Number(n).toLocaleString("es-CO");
    }

    async function cargarIngresos() {
      let usuarioId = getUsuarioId(); // Lee el id del usuario de sessionStorage
      let lista = document.getElementById("listaIngresos");

      try {
        let ingresos = await getIngresos(usuarioId); // GET /api/ingresos/{usuarioId}

        if (ingresos.length === 0) { // Si el usuario no tiene ingresos todavía
          lista.innerHTML = '<p class="sin-datos">No hay ingresos registrados aún.</p>';
          return;
        }

        // Construye el HTML de cada ingreso y lo muestra en la lista
        lista.innerHTML = ingresos.map(item => `
          <div class="movimiento-item">
            <div class="mov-info">
              <div class="mov-icono ingreso"></div> <!-- Ícono verde de ingreso -->
              <div>
                <div class="mov-nombre">${item.descripcion}</div> <!-- Descripción del ingreso -->
                <div class="mov-categoria">${item.categoria || ''}</div> <!-- Categoría o vacío -->
              </div>
            </div>
            <div class="mov-derecha">
              <div class="mov-valores">
                <div class="mov-valor ingreso">+${formatCOP(item.monto)}</div> <!-- Monto en verde -->
                <div class="mov-fecha">${item.fecha}</div>
              </div>
              <button class="btn-eliminar" onclick="borrarIngreso(${item.id})" title="Eliminar"></button>
              <!-- Pasa el id real de la BD para poder eliminar el registro correcto -->
            </div>
          </div>
        `).join("");

      } catch (error) {
        lista.innerHTML = '<p class="sin-datos">Error al cargar ingresos.</p>'; // Mensaje de error visible
        console.error(error); // Detalle del error en consola para depurar
      }
    }

    async function agregarIngresoNuevo() {
      let descripcion = document.getElementById("descripcion").value.trim(); // trim() quita espacios al inicio y fin
      let categoria = document.getElementById("categoria").value;
      let monto = document.getElementById("monto").value;
      let fecha = document.getElementById("fecha").value;

      if (!descripcion || !monto || !fecha) { // Valida que ningún campo esté vacío
        alert("Completa todos los campos.");
        return;
      }

      let montoNum = parseCOP(monto);
      if (isNaN(montoNum) || montoNum <= 0) {
        alert("Ingresa un valor válido en pesos colombianos.");
        return;
      }

      try {
        await agregarIngreso(getUsuarioId(), { // POST /api/ingresos/{usuarioId}
          monto: montoNum, // parseCOP convierte "1.500.000" → 1500000
          descripcion: descripcion,
          fecha: fecha,
          categoria: categoria
        });

        document.getElementById("descripcion").value = "";
        document.getElementById("monto").value = "";
        document.getElementById("fecha").valueAsDate = new Date();

        cargarIngresos(); // Recarga la lista para mostrar el nuevo ingreso

      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    async function borrarIngreso(id) { // Recibe el id del ingreso a eliminar
      try {
        await eliminarIngreso(id); // DELETE /api/ingresos/{id}
        cargarIngresos(); // Recarga la lista después de eliminar
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    document.getElementById("fecha").valueAsDate = new Date();
    initAllCOPInputs(); // Inicializa todos los inputs con data-cop="true"
    cargarIngresos();

  </script>

</body>

</html>
