  <div class="contenido">

    <p class="page-title">Gastos</p>
    <p class="page-subtitle">Registra y categoriza tus gastos</p>

    <p class="seccion-titulo">Agregar gasto</p>

    <!-- Formulario para registrar un nuevo gasto -->
    <div class="form-agregar">
      <div class="form-grupo">
        <label>Descripción</label>
        <input id="descripcion" type="text" placeholder="Ej: Arriendo, Mercado...">
      </div>
      <div class="form-grupo">
        <label>Categoría</label>
        <select id="categoria"> <!-- Categorías típicas de gastos del hogar -->
          <option value="Vivienda">Vivienda</option>
          <option value="Alimentación">Alimentación</option>
          <option value="Transporte">Transporte</option>
          <option value="Salud">Salud</option>
          <option value="Educación">Educación</option>
          <option value="Entretenimiento">Entretenimiento</option>
          <option value="Ropa">Ropa</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-grupo">
        <label>Valor en pesos colombianos ($)</label>
        <input id="monto" type="text" inputmode="numeric" placeholder="Ej: 80.000" data-cop="true"> <!-- data-cop activa el formateador COP -->
      </div>
      <div class="form-grupo">
        <label>Fecha</label>
        <input id="fecha" type="date"> <!-- Devuelve la fecha en formato YYYY-MM-DD -->
      </div>
      <button class="btn-agregar" onclick="agregarGastoNuevo()">+ Agregar</button>
    </div>

    <p class="seccion-titulo">Historial de gastos</p>
    <div class="lista-movimientos" id="listaGastos"></div> <!-- Se llena con JS -->

  </div>

  <script src="js/api.js"></script>
  <script src="js/cop-input.js"></script>

  <script>

    verificarSesion(); // Si no hay sesión activa redirige al login

    function formatCOP(n) { // Formato de moneda colombiana: 15000 → $15.000
      return "$" + Number(n).toLocaleString("es-CO");
    }

    async function cargarGastos() {
      let usuarioId = getUsuarioId(); // Id del usuario guardado en sessionStorage
      let lista = document.getElementById("listaGastos");

      try {
        let gastos = await getGastos(usuarioId); // GET /api/gastos/{usuarioId}

        if (gastos.length === 0) { // Si aún no hay gastos registrados
          lista.innerHTML = '<p class="sin-datos">No hay gastos registrados aún.</p>';
          return;
        }

        // Genera y muestra el HTML de cada gasto
        lista.innerHTML = gastos.map(item => `
      <div class="movimiento-item">
        <div class="mov-info">
          <div class="mov-icono gasto"></div> <!-- Ícono rojo de gasto -->
          <div>
            <div class="mov-nombre">${item.descripcion}</div>
            <div class="mov-categoria">${item.categoria || ''}</div> <!-- Si no hay categoría muestra vacío -->
          </div>
        </div>
        <div class="mov-derecha">
          <div class="mov-valores">
            <div class="mov-valor gasto">-${formatCOP(item.monto)}</div> <!-- Monto en rojo con signo - -->
            <div class="mov-fecha">${item.fecha}</div>
          </div>
          <button class="btn-eliminar" onclick="borrarGasto(${item.id})" title="Eliminar"></button>
          <!-- item.id es el id real de la base de datos, necesario para eliminar el registro -->
        </div>
      </div>
    `).join(""); // join("") evita que aparezcan comas entre los elementos

      } catch (error) {
        lista.innerHTML = '<p class="sin-datos">Error al cargar gastos.</p>';
        console.error(error); // Imprime el error completo en consola
      }
    }

    async function agregarGastoNuevo() {
      let descripcion = document.getElementById("descripcion").value.trim(); // trim() elimina espacios extra
      let categoria = document.getElementById("categoria").value;
      let monto = document.getElementById("monto").value;
      let fecha = document.getElementById("fecha").value;

      if (!descripcion || !monto || !fecha) { // Verifica que no haya campos vacíos
        alert("Completa todos los campos.");
        return; // Detiene la ejecución si falta algo
      }

      let montoNum = parseCOP(monto);
      if (isNaN(montoNum) || montoNum <= 0) {
        alert("Ingresa un valor válido en pesos colombianos.");
        return;
      }

      try {
        await agregarGasto(getUsuarioId(), { // POST /api/gastos/{usuarioId}
          monto: montoNum,
          descripcion: descripcion,
          fecha: fecha,
          categoria: categoria
        });

        document.getElementById("descripcion").value = "";
        document.getElementById("monto").value = "";
        document.getElementById("fecha").valueAsDate = new Date();

        cargarGastos(); // Recarga la lista para mostrar el gasto recién agregado

      } catch (error) {
        alert("Error: " + error.message); // Muestra qué salió mal
      }
    }

    async function borrarGasto(id) { // id viene del botón eliminar de cada tarjeta
      try {
        await eliminarGasto(id); // DELETE /api/gastos/{id}
        cargarGastos(); // Actualiza la lista tras eliminar
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    document.getElementById("fecha").valueAsDate = new Date();
    initAllCOPInputs();
    cargarGastos();

  </script>

</body>
