      Cerrar sesión
    </button>

  <div class="contenido">

    <p class="page-title">Conversión de Moneda</p>
    <p class="page-subtitle">Convierte montos entre diferentes monedas</p>

    <div class="form-container">
      <form id="formConvertir">
        <div class="form-group">
          <label for="monto">Monto</label>
          <input type="number" id="monto" placeholder="Ej: 100" min="0.01" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="monedaOrigen">Moneda de Origen</label>
          <select id="monedaOrigen" required>
            <option value="USD">USD — Dólar Estadounidense</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — Libra Esterlina</option>
            <option value="JPY">JPY — Yen Japonés</option>
            <option value="COP" selected>COP — Peso Colombiano</option>
            <option value="MXN">MXN — Peso Mexicano</option>
            <option value="ARS">ARS — Peso Argentino</option>
            <option value="CLP">CLP — Peso Chileno</option>
            <option value="CAD">CAD — Dólar Canadiense</option>
            <option value="CHF">CHF — Franco Suizo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="monedaDestino">Moneda de Destino</label>
          <select id="monedaDestino" required>
            <option value="USD" selected>USD — Dólar Estadounidense</option>
            <option value="EUR">EUR — Euro</option>
            <option value="GBP">GBP — Libra Esterlina</option>
            <option value="JPY">JPY — Yen Japonés</option>
            <option value="COP">COP — Peso Colombiano</option>
            <option value="MXN">MXN — Peso Mexicano</option>
            <option value="ARS">ARS — Peso Argentino</option>
            <option value="CLP">CLP — Peso Chileno</option>
            <option value="CAD">CAD — Dólar Canadiense</option>
            <option value="CHF">CHF — Franco Suizo</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primario">Convertir</button>
      </form>

      <div id="resultado" class="resultado-conversion" style="display: none;"></div>
      <div id="error" class="error-msg" style="display: none;"></div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    verificarSesion();

    function formatCOP(n) {
      return "$" + Number(n).toLocaleString("es-CO");
    }

    function formatDecimal(n) {
      return Number(n).toLocaleString("es-CO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.getElementById("formConvertir").addEventListener("submit", async (e) => {
      e.preventDefault();

      const monto = parseFloat(document.getElementById("monto").value);
      const monedaOrigen = document.getElementById("monedaOrigen").value;
      const monedaDestino = document.getElementById("monedaDestino").value;

      const resultadoDiv = document.getElementById("resultado");
      const errorDiv = document.getElementById("error");

      resultadoDiv.style.display = "none";
      errorDiv.style.display = "none";

      try {
        const resultado = await convertirMoneda(monto, monedaOrigen, monedaDestino);

        resultadoDiv.innerHTML = `
          <h3>Resultado de la Conversión</h3>
          <p class="conversion-original">${formatCOP(monto)} ${monedaOrigen}</p>
          <p class="conversion-flecha">=</p>
          <p class="conversion-resultado">${formatCOP(resultado.montoConvertido)} ${resultado.monedaDestino}</p>
          <p class="conversion-tasa">Tasa: 1 ${monedaOrigen} = ${formatDecimal(resultado.tasa)} ${monedaDestino}</p>
        `;
        resultadoDiv.style.display = "block";

      } catch (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = "block";
      }
    });
  </script>

</body>

</html>
